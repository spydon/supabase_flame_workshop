name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
      - run: dart pub get
      - run: |
          flutter build web \
            --base-href /supabase_flame_workshop/ \
            --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} \
            --dart-define=SUPABASE_KEY=${{ vars.SUPABASE_KEY }}
        working-directory: packages/game
      - run: cp build/web/index.html build/web/404.html
        working-directory: packages/game
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/game/build/web
      - id: deployment
        uses: actions/deploy-pages@v4
